  # BEFORE Tree fixtures because "CoreTree/Tests/" contains "Tree" too
  - tool: find_symbols_by_pattern
    match:
      target_type: "classes_and_structs_only"
      file_name:
        contains: "CoreTree/Tests/"
    response:
      results:
        - qualified_name: "ItemTestFixture"
          kind: "class"
          prototype: "class ItemTestFixture : public ::testing::Test"
          file: "CoreTree/Tests/Tree_DocumentTests.cpp"
          line: 18
