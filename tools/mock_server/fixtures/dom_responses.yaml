  # set_project / sync_project (defaults)
  # =================================================================

  - tool: set_project
    default: true
    response:
      project_path: "/path/to/html-engine"
      status: "ready"
      indexed_classes: 156
      indexed_functions: 892
      parsed_files: 347

  - tool: sync_project
    default: true
    response:
      state: "indexed"
      system_state: "ready"
      parsed_files: 347
      indexed_classes: 156
