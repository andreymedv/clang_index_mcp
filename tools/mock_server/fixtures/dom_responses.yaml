# Canned MCP tool responses for HTML Tree codebase model.
#
# Codebase model:
#   CoreTree/Public/Tree_*.h, CoreTree/Private/Tree_*Impl.*, CoreTree/Tests/Tree_*Tests.cpp
#   CoreCSS/Public/CSS_*.h, CoreCSS/Private/CSS_*.cpp
#   EditorUI/Public/UI_*.h, EditorUI/Private/UI_*.cpp
#   TableEngine/Public/TBL_*.h, TableEngine/Private/TBL_*.cpp
#   TestUtils/ItemBuilder.h, TestUtils/AssertionHelpers.h

responses:
